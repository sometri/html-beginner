<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Position Example</title>
    <style>
        .container {
            position: relative;
            width: 400px;
            height: 300px;
            border: 2px solid #333;
            margin: 40px auto;
            background: #f0f0f0;
        }
        .box-static {
            position: static;
            width: 100px;
            height: 60px;
            background: #8ecae6;
            line-height: 60px;
            text-align: center;
            margin: 10px;
        }
        .box-relative {
            position: relative;
            top: 20px;
            left: 30px;
            width: 100px;
            height: 60px;
            background: #219ebc;
            color: #fff;
            line-height: 60px;
            text-align: center;
            margin: 10px;
        }
        .box-absolute {
            position: absolute;
            top: 50px;
            right: 30px;
            width: 100px;
            height: 60px;
            background: #023047;
            color: #fff;
            line-height: 60px;
            text-align: center;
        }
        .box-fixed {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 50px;
            background: #ffb703;
            color: #333;
            line-height: 50px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .box-sticky {
            position: sticky;
            top: 0;
            width: 100%;
            height: 40px;
            background: #fb8500;
            color: #fff;
            line-height: 40px;
            text-align: center;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="box-sticky">Sticky Box (scroll down)</div>
    <div class="container">
        <div class="box-static">Static</div>
        <div class="box-relative">Relative</div>
        <div class="box-absolute">Absolute</div>
    </div>
    <div class="box-fixed">Fixed Box</div>
    <div style="height: 800px;"></div>
</body>
</html>
