<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f8f8;
        }
        h1 {
            color: #2c3e50;
        }
        footer {
            background-color: #2c3e50;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<h1>Contact Us</h1>
<p>Your contact information goes here.</p>
<form action="">
    <label for="name">Name:</label><br>
    <input type="text" id="name" name="name" required style="width:100%;padding:10px;margin:10px 0;"><br>
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required style="width:100%;padding:10px;margin:10px 0;"><br>
    <label for="message">Message:</label><br>
    <textarea id="message" name="message" rows="5" required style="width:100%;padding:10px;margin:10px 0;"></textarea><br>
    <button type="submit" style="padding:10px 20px;background-color:#2c3e50;color:#fff;border:none;cursor:pointer;">Submit</button>
</form>

<footer>
    <p>&copy; 2024 MyWebsite. All rights reserved.</p>
</footer>

</body>
</html>
