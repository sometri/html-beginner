<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Animation</title>
    <style>
        body {
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            width: 60px;
            height: 60px;
            background: #4CAF50;
            border-radius: 10px;
            position: relative;
            animation: moveBox 2s infinite alternate ease-in-out;
        }
        @keyframes moveBox {
            from { left: 0; }
            to { left: 300px; }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
