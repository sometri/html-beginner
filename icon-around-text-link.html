<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Menu</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #333;
            margin: 0;
        }

        .menu {
            position: relative;
            width: 200px; /* Increased width for more icons */
            height: 200px; /* Increased height for more icons */
        }

        .icon {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            background-color: #1d3e63;
            border-radius: 50%;
            position: absolute;
            transition: transform 0.3s, opacity 0.3s, background-color 0.3s;
            cursor: pointer; /* Change cursor to pointer */
            text-decoration: none; /* Remove underline */
        }

        .middle-icon {
            z-index: 1;
            background-color: #FFD700; /* Fresh middle icon color */
            color: white; /* Middle icon text color */
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .icon:hover {
            background-color: #0056b3; /* Change color on hover for all icons */
            color: white; /* Change icon color on hover */
        }

        .middle-icon:hover {
            transform: scale(1.1); /* Scale up on hover */
        }

        /* Position icons in a circular layout */
        .icon:nth-child(2) { transform: rotate(0deg) translate(80px) rotate(0deg); }
        .icon:nth-child(3) { transform: rotate(45deg) translate(80px) rotate(-45deg); }
        .icon:nth-child(4) { transform: rotate(90deg) translate(80px) rotate(-90deg); }
        .icon:nth-child(5) { transform: rotate(135deg) translate(80px) rotate(-135deg); }
        .icon:nth-child(6) { transform: rotate(180deg) translate(80px) rotate(-180deg); }
        .icon:nth-child(7) { transform: rotate(225deg) translate(80px) rotate(-225deg); }
        .icon:nth-child(8) { transform: rotate(270deg) translate(80px) rotate(-270deg); }
        .icon:nth-child(9) { transform: rotate(315deg) translate(80px) rotate(-315deg); }
    </style>
</head>
<body>
    <div class="menu">
        <div class="icon middle-icon" onclick="toggleMenu(event)">🤷‍♂️</div> <!-- Middle icon -->
        <a href="https://www.example.com" target="_blank" class="icon hidden" data-original="🌐" onmouseover="changeMessage(this, 'Website')" onmouseout="resetMessage(this)">🌐</a>
        <a href="https://www.example.com/call" target="_blank" class="icon hidden" data-original="📞" onmouseover="changeMessage(this, 'Call')" onmouseout="resetMessage(this)">📞</a>
        <a href="https://www.example.com/email" target="_blank" class="icon hidden" data-original="✉️" onmouseover="changeMessage(this, 'Email')" onmouseout="resetMessage(this)">✉️</a>
        <a href="https://www.example.com/tv" target="_blank" class="icon hidden" data-original="📺" onmouseover="changeMessage(this, 'TV')" onmouseout="resetMessage(this)">📺</a>
        <a href="https://www.example.com/camera" target="_blank" class="icon hidden" data-original="📸" onmouseover="changeMessage(this, 'Camera')" onmouseout="resetMessage(this)">📸</a>
        <a href="https://www.example.com/work" target="_blank" class="icon hidden" data-original="💼" onmouseover="changeMessage(this, 'Work')" onmouseout="resetMessage(this)">💼</a>
        <a href="https://www.example.com/art" target="_blank" class="icon hidden" data-original="🎨" onmouseover="changeMessage(this, 'Art')" onmouseout="resetMessage(this)">🎨</a>
        <a href="https://www.example.com/music" target="_blank" class="icon hidden" data-original="🎵" onmouseover="changeMessage(this, 'Music')" onmouseout="resetMessage(this)">🎵</a>
    </div>

    <script>
        function toggleMenu(event) {
            event.stopPropagation(); // Prevent click event from bubbling to the document
            const icons = document.querySelectorAll('.menu .icon:not(.middle-icon)');
            icons.forEach(icon => {
                icon.classList.toggle('hidden');
            });
        }

        function hideIcons() {
            const icons = document.querySelectorAll('.menu .icon:not(.middle-icon)');
            icons.forEach(icon => {
                icon.classList.add('hidden');
            });
        }

        // Hide icons when clicking outside the menu
        document.addEventListener('click', hideIcons);

        function changeMessage(icon, message) {
            icon.setAttribute('data-hovered', message); // Store hover message
            icon.innerHTML = message; // Change to message on hover
        }

        function resetMessage(icon) {
            const originalMessage = icon.getAttribute('data-original'); // Get original icon
            icon.innerHTML = originalMessage; // Reset to original icon
        }
    </script>
</body>
</html>
