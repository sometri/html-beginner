<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Width and Max-Width Example</title>
    <style>
        .container {
            width: 100%;         /* Take full width of parent */
            max-width: 1200px;  /* Maximum width of 1200 pixels */
            margin: 0 auto;     
            padding: 10px 20px;     
            background-color: #007BFF; 
            color: white;       
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Responsive Container</h1>
        <p>This container can expand to fill the screen but will not exceed 1200px in width.</p>
    </div>
</body>
</html>
