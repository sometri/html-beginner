<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Display Example</title>
    <style>
        .block-example {
            display: block;
            background: #e0e0e0;
            padding: 10px;
            margin-bottom: 10px;
        }
        .inline-example {
            display: inline;
            background: #c0ffc0;
            padding: 5px;
        }
        .inline-block-example {
            display: inline-block;
            background: #c0c0ff;
            padding: 10px;
            margin-right: 10px;
        }
        .none-example {
            display: none;
        }
    </style>
</head>
<body>
    <div class="block-example">This is a block element (display: block)</div>
    <span class="inline-example">This is an inline element (display: inline)</span>
    <span class="inline-block-example">This is inline-block (display: inline-block)</span>
    <div class="none-example">You can't see me (display: none)</div>
</body>
</html>
