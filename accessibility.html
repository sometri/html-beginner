<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessibility</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f8f8;
        }

        h1 {
            color: #2c3e50;
        }

        footer {
            background-color: #2c3e50;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Accessibility</h1>
    <p>Your accessibility information goes here.</p>
    <ul>
        <li>Accessibility Feature 1</li>
        <li>Accessibility Feature 2</li>
        <li>Accessibility Feature 3</li>
    </ul>
    <ul>
        <li>Accessibility Feature 4</li>
        <li>Accessibility Feature 5</li>
    </ul>
    <select name="" id="">
        <option value="">Select an option</option>
        <option value="">Option 1</option>
        <option value="">Option 2</option>
    </select>
    <figure>
        <img src="accessibility-image.png" alt="Accessibility Image" style="max-width:100%;height:auto;">
        <figcaption>Figure 1: Accessibility Image</figcaption>
    </figure>
    <audio src="your-audio-file.mp3" controls style="max-width:100%;
height:auto;">
        Your browser does not support the audio element.
    </audio>
    <video src="your-video-file.mp4" controls style="max-width:100%;height:auto;">
        Your browser does not support the video element.
    </video>


    <footer>
        <p>&copy; 2024 MyWebsite. All rights reserved.</p>
    </footer>

</body>

</html>
